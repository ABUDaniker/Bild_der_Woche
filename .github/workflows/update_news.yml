name: Weekly News Scraper

on:
  schedule:
    - cron: '30 16 * * 5'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Python Scraper
        run: python fetch_news.py

      - name: Commit and Push Update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "News Scraper Bot"
          git add news_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Neues Bild der Woche" && git push)
